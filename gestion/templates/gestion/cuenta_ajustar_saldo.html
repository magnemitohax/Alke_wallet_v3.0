{% extends "gestion/base.html" %}
{% block title %}Ajustar saldo{% endblock %}
{% block content %}
<h1>Ajustar saldo — {{ cuenta.numero_cuenta }}</h1>
<p>Saldo actual: ${{ cuenta.saldo }}</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Aplicar</button>
    <a href="{% url 'cuenta_detail' cuenta.pk %}">Cancelar</a>
</form>
{% endblock %}
