{% extends "gestion/base.html" %}
{% block title %}Transferir{% endblock %}
{% block content %}
<h1>Transferir desde {{ cuenta.numero_cuenta }}</h1>
<p>Saldo disponible: ${{ cuenta.saldo }}</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Transferir</button>
    <a href="{% url 'cuenta_detail' cuenta.pk %}">Cancelar</a>
</form>
{% endblock %}
